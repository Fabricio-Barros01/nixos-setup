# ╔══════════════════════════════════════════════════════════════════╗
# ║  kitty.conf — Fabricio · NixOS · Hyprland style                  ║
# ║                                                                  ║
# ║  Sections (Konsole-style panel):                                 ║
# ║    1. Theme       5. Scrollback                                  ║
# ║    2. General     6. Mouse                                       ║
# ║    3. Tabs        7. Keyboard                                    ║
# ║    4. Appearance  8. Advanced                                    ║
# ║                                                                  ║
# ║  Palette: Catppuccin Mocha (the de facto Hyprland rice palette)  ║
# ║  Apply the theme once with:                                      ║
# ║    kitty +kitten themes --reload-in=all Catppuccin-Mocha         ║
# ║                                                                  ║
# ║  kitty rule: comments only on their own line.                    ║
# ║  Saving this file reloads kitty automatically.                   ║
# ╚══════════════════════════════════════════════════════════════════╝


# ── 1. THEME ────────────────────────────────────────────────── {{{
# Managed by `kitty +kitten themes`. Kept at the top so the custom
# colors below (tabs, borders) take precedence.

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# }}}


# ── 2. GENERAL ──────────────────────────────────────────────── {{{

remember_window_size    yes

# No title bar, like a tiling compositor.
# On KDE: move with Meta+drag, resize with Meta+right-drag.
hide_window_decorations yes

# Only ask before closing if a command is running
confirm_os_window_close -1

enable_audio_bell       no
window_alert_on_bell    yes

# Desktop notification when a command takes >30 s in a hidden tab
notify_on_cmd_finish    invisible 30.0

# }}}


# ── 3. TABS (side bar) ──────────────────────────────────────── {{{

tab_bar_edge            left
tab_bar_min_tabs        1
tab_bar_style           separator
tab_separator           " "
tab_title_max_length    24
tab_bar_margin_width    6.0
tab_bar_margin_height   6.0 6.0
tab_bar_show_new_tab_button yes
tab_switch_strategy     left

tab_title_template      "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab} {index}  {tab.last_focused_progress_percent}{title[title.rfind('/')+1:]} "
bell_on_tab             "🔔 "
tab_activity_symbol     "● "

# Catppuccin Mocha: mauve active tab, translucent bar
active_tab_foreground   #11111b
active_tab_background   #cba6f7
active_tab_font_style   bold
inactive_tab_foreground #6c7086
inactive_tab_background #181825
inactive_tab_font_style normal
tab_bar_background      none
tab_bar_margin_color    none

# }}}


# ── 4. APPEARANCE ───────────────────────────────────────────── {{{

# Font
font_family             JetBrainsMono Nerd Font Mono
font_size               11.0
disable_ligatures       cursor

# Glass: translucency + blur (KWin supports kitty's blur on Wayland)
background_opacity      0.85
background_blur         32
dynamic_background_opacity yes

# Gaps: padding inside each pane, margin between panes
window_padding_width    10
window_margin_width     4
single_window_margin_width 0

# Borders: thick colored border on the focused pane, like Hyprland
window_border_width     2px
draw_minimal_borders    no
active_border_color     #cba6f7
inactive_border_color   #313244
bell_border_color       #f38ba8

# Dim inactive panes (only when more than one is visible)
inactive_text_alpha     -0.75

# Layouts
enabled_layouts         splits,stack,tall

# Cursor with "animations": smooth fade blink + snappy trail
cursor_shape            beam
cursor_shape_unfocused  hollow
cursor_beam_thickness   2
cursor_blink_interval   0.6 ease-in-out
cursor_stop_blinking_after 10.0
cursor_trail            1
cursor_trail_decay      0.08 0.25
cursor_trail_start_threshold 2

# }}}


# ── 5. SCROLLBACK ───────────────────────────────────────────── {{{

scrollback_lines              100000
scrollback_pager_history_size 200
scrollbar                     scrolled
scrollbar_handle_color        selection_background
wheel_scroll_multiplier       5.0

# }}}


# ── 6. MOUSE ────────────────────────────────────────────────── {{{

copy_on_select          clipboard
strip_trailing_spaces   smart
paste_actions           quote-urls-at-prompt,confirm,confirm-if-large

mouse_hide_wait         2.0
detect_urls             yes
open_url_with           default
url_style               curly
url_color               #89b4fa

# }}}


# ── 7. KEYBOARD ─────────────────────────────────────────────── {{{
# Konsole-inspired shortcuts.

# Tabs
map ctrl+shift+t        launch --type=tab --cwd=current
map ctrl+shift+q        close_tab
map shift+left          previous_tab
map shift+right         next_tab
map ctrl+shift+left     move_tab_backward
map ctrl+shift+right    move_tab_forward
map ctrl+alt+s          set_tab_title
map alt+1               goto_tab 1
map alt+2               goto_tab 2
map alt+3               goto_tab 3
map alt+4               goto_tab 4
map alt+5               goto_tab 5
map alt+6               goto_tab 6
map alt+7               goto_tab 7
map alt+8               goto_tab 8
map alt+9               goto_tab 9

# Windows
map ctrl+shift+n        launch --type=os-window --cwd=current

# Splits — Ctrl+( side by side, Ctrl+) top/bottom
map ctrl+shift+9        launch --location=vsplit --cwd=current
map ctrl+shift+0        launch --location=hsplit --cwd=current
map ctrl+shift+enter    launch --location=split --cwd=current
map alt+left            neighboring_window left
map alt+right           neighboring_window right
map alt+up              neighboring_window up
map alt+down            neighboring_window down
map ctrl+shift+z        toggle_layout stack

# Glass on the fly: more / less transparent / fully opaque
map ctrl+alt+equal      set_background_opacity +0.05
map ctrl+alt+minus      set_background_opacity -0.05
map ctrl+alt+0          set_background_opacity 1

# Scrollback and search
map ctrl+shift+f        search_scrollback
map ctrl+shift+up       scroll_to_prompt -1
map ctrl+shift+down     scroll_to_prompt 1

# distrobox containers
map ctrl+alt+a          launch --type=tab --tab-title=aster distrobox enter aster

# }}}


# ── 8. ADVANCED ─────────────────────────────────────────────── {{{

shell_integration       enabled
auto_reload_config      0.1
update_check_interval   0

# Inside Ubuntu containers, if a program complains about
# "unknown terminal type xterm-kitty":
#   sudo apt install kitty-terminfo

# }}}

